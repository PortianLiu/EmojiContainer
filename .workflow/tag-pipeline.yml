# Gitee Go：推送 v* Tag 时构建 Windows 便携包与 Android APK
# 在 Gitee 仓库 → 流水线 → 密钥/变量 中配置：
#   ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、
#   ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
version: '1.0'
name: tag-pipeline
displayName: Tag 构建发布
triggers:
  push:
    tags:
      - v*

stages:
  - stage:
      name: build
      displayName: 构建
      steps:
        - step: build@general
          name: build_release
          displayName: Flutter Windows & Android Release
          runsOn: windows/2022
          commands: |
            chcp 65001
            $ErrorActionPreference = "Stop"
            $TAG = $env:CI_COMMIT_TAG
            if ([string]::IsNullOrWhiteSpace($TAG)) { $TAG = "v$env:CI_BUILD_NUMBER" }

            Write-Host "=== 安装 Flutter ==="
            git clone https://github.com/flutter/flutter.git -b stable --depth 1 C:\flutter
            $env:Path = "C:\flutter\bin;" + $env:Path
            flutter --version
            flutter config --no-analytics
            flutter doctor -v

            Write-Host "=== 依赖 ==="
            flutter pub get

            Write-Host "=== 恢复 Android 签名 ==="
            if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
              throw "未配置 ANDROID_KEYSTORE_BASE64"
            }
            $env:ANDROID_KEYSTORE_BASE64 | Out-File -FilePath keystore_base64_temp.txt -Encoding ASCII
            certutil -decode keystore_base64_temp.txt android/app/emoji-container-key.jks
            Remove-Item keystore_base64_temp.txt
            @"
            keyAlias=$env:ANDROID_KEY_ALIAS
            keyPassword=$env:ANDROID_KEY_PASSWORD
            storeFile=emoji-container-key.jks
            storePassword=$env:ANDROID_KEYSTORE_PASSWORD
            "@ | Out-File -FilePath android/key.properties -Encoding ASCII

            Write-Host "=== 构建 Windows ==="
            flutter build windows --release

            Write-Host "=== 构建 Android APK ==="
            flutter build apk --release

            Write-Host "=== 安装 7-Zip 与 Inno Setup ==="
            choco install 7zip innosetup -y

            Write-Host "=== 打包产物 ==="
            New-Item -ItemType Directory -Force -Path build/dist | Out-Null
            $zipPath = "build/dist/EmojiContainer_Win_$TAG.zip"
            if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
            Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zipPath
            7z a -t7z -mx=9 -mmt=on "build/dist/EmojiContainer_Win_$TAG.7z" "build/windows/x64/runner/Release/*"
            Copy-Item "build/app/outputs/flutter-apk/app-release.apk" "build/dist/EmojiContainer_Android_$TAG.apk"

            $VERSION = $TAG.TrimStart('v')
            $env:MY_APP_VERSION = $VERSION
            iscc "EmojiContainer.iss"
          artifacts:
            - name: BUILD_ARTIFACT
              path:
                - ./build/dist/

  - stage:
      name: publish
      displayName: 发布制品
      steps:
        - step: publish@general_artifacts
          name: upload_artifacts
          displayName: 上传制品
          dependArtifact: BUILD_ARTIFACT
          artifactName: EmojiContainer-${CI_COMMIT_TAG}
