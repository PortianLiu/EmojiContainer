name: migrate-v29-assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download from old repo and upload to new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          gh release download v2.9 -R PortianLiu/emoji_container -D /tmp/rel
          ls -lh /tmp/rel
          gh release upload v2.9 -R PortianLiu/EmojiContainer \
            /tmp/rel/EmojiContainer_Android_v2.9.apk \
            /tmp/rel/EmojiContainer_Setup_x64_v2.9.exe \
            /tmp/rel/EmojiContainer_Win_v2.9.7z \
            /tmp/rel/EmojiContainer_Win_v2.9.zip \
            --clobber
          gh release view v2.9 -R PortianLiu/EmojiContainer
