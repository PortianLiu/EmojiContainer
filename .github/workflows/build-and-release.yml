name: Build & Release EmojiContainer

# 推送 v* Tag 时自动构建并发布（如 v2.3）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android keystore
        run: |
          $BASE64_CONTENT = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($BASE64_CONTENT)) {
            throw "Missing secret ANDROID_KEYSTORE_BASE64"
          }
          $BASE64_CONTENT | Out-File -FilePath keystore_base64_temp.txt -Encoding ASCII
          certutil -decode keystore_base64_temp.txt android/app/emoji-container-key.jks
          Remove-Item keystore_base64_temp.txt
        shell: pwsh

      - name: Generate Android key.properties
        run: |
          $KEY_PROPS_CONTENT = @"
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=emoji-container-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          "@
          $KEY_PROPS_CONTENT | Out-File -FilePath android/key.properties -Encoding ASCII
        shell: pwsh

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Install 7-Zip and Inno Setup
        run: |
          choco install 7zip innosetup -y

      - name: Package Windows portable (zip & 7z)
        run: |
          $TAG = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null
          $zipPath = "build/dist/EmojiContainer_Win_$TAG.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zipPath
          7z a -t7z -mx=9 -mmt=on "build/dist/EmojiContainer_Win_$TAG.7z" "build/windows/x64/runner/Release/*"
        shell: pwsh

      - name: Build Windows installer with Inno Setup
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $env:MY_APP_VERSION = $VERSION
          iscc "EmojiContainer.iss"
        shell: pwsh

      - name: Rename APK
        run: |
          $TAG = "${{ github.ref_name }}"
          Copy-Item "build/app/outputs/flutter-apk/app-release.apk" "build/dist/EmojiContainer_Android_$TAG.apk"
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/EmojiContainer_Win_${{ github.ref_name }}.zip
            build/dist/EmojiContainer_Win_${{ github.ref_name }}.7z
            build/dist/EmojiContainer_Setup_x64_${{ github.ref_name }}.exe
            build/dist/EmojiContainer_Android_${{ github.ref_name }}.apk
          body: |
            ## EmojiContainer ${{ github.ref_name }}

            - **Windows 安装包**：`EmojiContainer_Setup_x64_${{ github.ref_name }}.exe`
            - **Windows 便携版**：`EmojiContainer_Win_${{ github.ref_name }}.zip` / `.7z`
            - **Android**：`EmojiContainer_Android_${{ github.ref_name }}.apk`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
